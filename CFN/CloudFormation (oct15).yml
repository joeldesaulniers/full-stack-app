AWSTemplateFormatVersion: '2010-09-09'
Description: Simple CloudFormation template that deploys an AWS Lambda function

Parameters:
  EnvironmentType:
    Type: String
    Default: Production
    Description: The environment name for this function

  Lambdaname:
    Type: String
    Default: joelslambda
    Description: Enter the name for the Lambda function

Resources:
  # IAM Role for Lambda execution
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda Function
  MyLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref Lambdaname
      Handler: index.handler
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {
                  'statusCode': 200,
                  'body': 'Hello from CloudFormation !'
              }

      Tags:
        - Key: Environment
          Value: !Ref EnvironmentType

Outputs:
  LambdaArn:
    Description: ARN of the Lambda function
    Value: !GetAtt MyLambdaFunction.Arn
